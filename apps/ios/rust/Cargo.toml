[package]
name = "burmalda57"
version = "1.7.1"
edition = "2021"
license = "Apache-2.0"

[lib]
# cdylib — .so для Android; rlib — чтобы iOS-бинарник мог слинковаться с библиотекой
crate-type = ["cdylib", "rlib"]

# iOS-приложение — обычный бинарник (так Slint и рекомендует собирать под iOS).
# required-features нужен, чтобы `cargo ndk build` (Android) его не пытался собирать.
# Сборка: cargo build --release --target aarch64-apple-ios --bin burmalda57-ios --features ios-app
[[bin]]
name = "burmalda57-ios"
path = "src/main.rs"
required-features = ["ios-app"]

[features]
ios-app = []

[profile.release]
opt-level = "z"       
lto = true              
codegen-units = 1         
panic = "abort"           
strip = true              

[profile.release.package.aes-gcm]
opt-level = 3

[profile.release.package.ring]
opt-level = 3

[profile.release.package.aes]
opt-level = 3

[dependencies]
# Сеть
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sentry = { version = "0.48.4", default-features = false, features = [
    "backtrace", "contexts", "panic", "ureq", "rustls"
] }
semver = "1"
# Криптография (сессия)
aes = "0.8"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
base64 = "0.21"

log = "0.4"

# ---------- Android: JNI + Slint на NativeActivity (FemtoVG через вендоренный бэкенд) ----------
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.13"
jni = "0.21"
ndk-context = "0.1"
jni-sys = "0.4.1"
slint = { version = "1.16", default-features = false, features = [
    "compat-1-2",
    "renderer-femtovg",
    "backend-android-activity-06",
] }

# ---------- iOS: Slint на winit + Skia (Metal). FemtoVG/glutin на iOS не работают ----------
[target.'cfg(target_os = "ios")'.dependencies]
slint = { version = "1.16", default-features = false, features = [
    "compat-1-2",
    "backend-winit",
    "renderer-skia",
] }

[build-dependencies]
slint-build = "1.16"
# компилирует ios/glue.m (Objective-C) при сборке под iOS
cc = "1"

[patch.crates-io]
i-slint-backend-android-activity = { path = "vendor/i-slint-backend-android-activity" }
