name: iOS (unsigned IPA)

# Собирает неподписанный .ipa — без сертификатов, профилей и Apple ID.
# Готовый файл ставится на устройство через AltStore / Sideloadly / TrollStore:
# они подписывают приложение уже на вашей стороне (см. README.md).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "rust/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: write # нужно только для публикации .ipa в GitHub Release по тегу

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  IPHONEOS_DEPLOYMENT_TARGET: "15.0"
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Подготовка окружения
        run: |
          # rust/.cargo/config.toml включает sccache для локальной разработки;
          # на раннере его нет, и cargo упал бы сразу при запуске rustc.
          sed -i '' '/rustc-wrapper/d' rust/.cargo/config.toml
          # cmake нужен aws-lc-sys (TLS), ninja — запасной путь Skia, если нет готовых бинарников
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja
          xcodebuild -version
          rustc --version

      - name: Сборка (cargo, aarch64-apple-ios)
        working-directory: rust
        run: >
          cargo build --release
          --target aarch64-apple-ios
          --bin burmalda57-ios
          --features ios-app

      - name: Упаковка в .ipa
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' rust/Cargo.toml | cut -d'"' -f2)
          IPA="burmalda57-${VERSION}-unsigned.ipa"
          echo "IPA=$IPA" >> "$GITHUB_ENV"

          APP="build/Payload/burmalda57.app"
          rm -rf build && mkdir -p "$APP"

          cp rust/target/aarch64-apple-ios/release/burmalda57-ios "$APP/burmalda57"
          chmod +x "$APP/burmalda57"
          sed -e "s/@VERSION@/${VERSION}/" -e "s/@BUILD@/${{ github.run_number }}/" \
              rust/ios/Info.plist > "$APP/Info.plist"
          plutil -lint "$APP/Info.plist"
          cp rust/ios/icons/*.png "$APP/"
          printf 'APPL????' > "$APP/PkgInfo"

          (cd build && zip -qry "$IPA" Payload)

          echo "--- Mach-O ---"
          lipo -info "$APP/burmalda57"
          vtool -show-build "$APP/burmalda57" | head -8 || true
          ls -lh "build/$IPA"

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: burmalda57-unsigned-ipa
          path: |
            build/${{ env.IPA }}
            rust/Cargo.lock
          if-no-files-found: error

      - name: GitHub Release (по тегу v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/${{ env.IPA }}
